<footer class="footer">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="footer-menu">
          <ul>
            {{ range site.Menus.footer }}
            <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
            {{ end }}
          </ul>
        </div>
        <p class="copyright">{{ site.Params.copyright | markdownify }}</p>
        <div class="footer-virginia">
          <img src="/images/virginia.svg" alt="Virginia" class="footer-virginia-svg">
          <span class="footer-virginia-text">Built with purpose in Virginia</span>
        </div>
      </div>
    </div>
  </div>
</footer>
